name: validate-marketplace
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketplace-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test catalog validator and updater behavior
        run: |
          python -m unittest discover -s tests -v
          python templates/plugin-update/test_auto_update.py
      - name: Validate local catalog
        run: python scripts/validate_marketplace.py --output catalog-report.json
      - name: Install pinned Claude plugin CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.263
      - name: Prove plugin installation does not start hooks or MCP servers
        run: python -m unittest test_marketplace.InstallTests.test_real_cli_does_not_run_hooks_or_mcp -v
        env:
          PYTHONPATH: tests
          MARKETPLACE_CLI_SMOKE_TEST: '1'
      - name: Validate marketplace schema with Claude CLI
        run: claude plugin validate .
      - name: Validate live sources and isolated installs
        run: python scripts/validate_marketplace.py --sources --install-smoke --allow-private-unavailable --output validation-report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKETPLACE_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.MARKETPLACE_READ_TOKEN || '' }}
      - name: Summarize coverage, including failures and private skips
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path('validation-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              if not path.exists():
                  out.write('Live source and install report unavailable; validation did not complete.\n')
              else:
                  report = json.loads(path.read_text())
                  out.write(f"Overall: **{report['overall_status']}**\n\n")
                  for key, count in report['summary'].items():
                      out.write(f"- {key}: {count}\n")
                  out.write('\n| Plugin | Source | Install | Detail |\n|---|---|---|---|\n')
                  for row in report['sources']:
                      reason = row.get('reason', row.get('install_reason', '')).replace('|', '\\|').replace('\n', ' ')
                      out.write(f"| {row['name']} | {row['status']} | {row.get('install_smoke', 'not-run')} | {reason} |\n")
                  for error in report['errors']:
                      out.write(f"\nError: {error}\n")
                  if report['summary']['private_skipped']:
                      print('::warning::Private repositories were not verified. See the explicit skipped entries; this is partial coverage, not a full pass.')
          PYTHON
      - name: Retain machine-readable validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketplace-validation-reports
          path: '*-report.json'
          if-no-files-found: warn
          retention-days: 14
